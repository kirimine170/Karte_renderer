name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go-test:
    name: Go tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run Go tests
        run: go test -count=1 ./...

  quality:
    name: Formatting and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check gofmt
        shell: bash
        run: |
          files="$(gofmt -l $(git ls-files '*.go'))"
          test -z "$files" || { printf 'gofmt required:\n%s\n' "$files"; exit 1; }
      - name: Run go vet
        run: go vet ./...

  node-test:
    name: Node fixture tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  p0-pdf-preflight:
    name: P0 real PDF preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Poppler
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils
      - name: Locate Chrome
        id: chrome
        shell: bash
        run: |
          browser="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$browser" || { echo "Chrome/Chromium is not installed on the runner"; exit 1; }
          echo "path=$browser" >> "$GITHUB_OUTPUT"
      - name: Render and preflight the exact 48-page B5 fixture
        shell: bash
        run: |
          mkdir -p build/p0-preflight
          go run ./cmd/karte-renderer \
            --pdf-engine chromium \
            --pdf-binary "${{ steps.chrome.outputs.path }}" \
            --expected-pages 48 \
            --preflight-report build/p0-preflight/report.json \
            --pdfinfo-binary "$(command -v pdfinfo)" \
            --pdffonts-binary "$(command -v pdffonts)" \
            --pdftotext-binary "$(command -v pdftotext)" \
            testdata/preflight/48-pages.md \
            build/p0-preflight/book.pdf
          grep -q '"passed": true' build/p0-preflight/report.json
          test "$(pdfinfo build/p0-preflight/book.pdf | awk '/^Pages:/ { print $2 }')" = "48"
      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-pdf-preflight
          path: build/p0-preflight/
          if-no-files-found: warn
          retention-days: 7

  windows-pdf-smoke:
    name: Windows PDF auto-discovery smoke
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Confirm system Edge is not required on PATH
        shell: pwsh
        run: |
          if (Get-Command msedge.exe -ErrorAction SilentlyContinue) {
            Write-Error 'The smoke test requires Edge discovery outside PATH'
          }
          $edgeCandidates = @(
            "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe",
            "${env:ProgramFiles}\Microsoft\Edge\Application\msedge.exe",
            "${env:LOCALAPPDATA}\Microsoft\Edge\Application\msedge.exe"
          )
          if (-not ($edgeCandidates | Where-Object { Test-Path -LiteralPath $_ })) {
            Write-Error 'Microsoft Edge is not installed in a standard Windows location'
          }
      - name: Render PDF using automatic browser discovery
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/windows-pdf-smoke | Out-Null
          go run ./cmd/karte-renderer --pdf-engine chromium testdata/p0/acceptance.md build/windows-pdf-smoke/acceptance.pdf
          $pdf = Get-Item -LiteralPath build/windows-pdf-smoke/acceptance.pdf
          if ($pdf.Length -lt 1024) {
            Write-Error "Generated PDF is unexpectedly small: $($pdf.Length) bytes"
          }
      - name: Upload Windows PDF evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-pdf-smoke
          path: build/windows-pdf-smoke/
          if-no-files-found: warn
          retention-days: 7
