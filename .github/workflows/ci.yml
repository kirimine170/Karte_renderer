name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go-test:
    name: Go tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run Go tests
        run: go test -count=1 ./...
      - name: Run platform-specific vet checks
        run: go vet ./...
      - name: Check process lifecycle races on Unix
        if: runner.os != 'Windows'
        run: go test -race -count=1 -run '^TestNative' .

  quality:
    name: Formatting and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check gofmt
        shell: bash
        run: |
          files="$(gofmt -l $(git ls-files '*.go'))"
          test -z "$files" || { printf 'gofmt required:\n%s\n' "$files"; exit 1; }
      - name: Run go vet
        run: go vet ./...

  node-test:
    name: Node fixture tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  p0-pdf-preflight:
    name: P0 real PDF preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Poppler
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils
      - name: Locate Chrome
        id: chrome
        shell: bash
        run: |
          browser="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$browser" || { echo "Chrome/Chromium is not installed on the runner"; exit 1; }
          echo "path=$browser" >> "$GITHUB_OUTPUT"
      - name: Render and preflight the exact 48-page B5 fixture
        shell: bash
        run: |
          mkdir -p build/p0-preflight
          go run ./cmd/karte-renderer \
            --pdf-engine chromium \
            --pdf-binary "${{ steps.chrome.outputs.path }}" \
            --expected-pages 48 \
            --preflight-report build/p0-preflight/report.json \
            --pdfinfo-binary "$(command -v pdfinfo)" \
            --pdffonts-binary "$(command -v pdffonts)" \
            --pdftotext-binary "$(command -v pdftotext)" \
            testdata/preflight/48-pages.md \
            build/p0-preflight/book.pdf
          grep -q '"passed": true' build/p0-preflight/report.json
          test "$(pdfinfo build/p0-preflight/book.pdf | awk '/^Pages:/ { print $2 }')" = "48"
      - name: Render the report fixture as document and Marp outputs
        shell: bash
        env:
          KARTE_REPORT_CHROMIUM: ${{ steps.chrome.outputs.path }}
          KARTE_REPORT_KEEP_OUTPUTS: "1"
        run: scripts/test-report-format.sh
      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-pdf-preflight
          path: |
            build/p0-preflight/
            build/report-format/
          if-no-files-found: warn
          retention-days: 7

  macos-render-smoke:
    name: macOS rendering (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Render document, Marp, and Instagram outputs with native Chrome
        shell: bash
        run: |
          set -euo pipefail
          browser='/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'
          test -x "$browser"
          output='build/macos-render-smoke/日本語 & 100%'
          mkdir -p "$output"
          go build -o build/macos-render-smoke/karte-renderer ./cmd/karte-renderer
          renderer=build/macos-render-smoke/karte-renderer
          "$renderer" --pdf-engine chromium --pdf-binary "$browser" examples/document.md "$output/document #1.pdf"
          for extension in html pdf pptx; do
            "$renderer" --browser-path "$browser" examples/slides.md "$output/slides #1.$extension"
            test -s "$output/slides #1.$extension"
          done
          "$renderer" instagram image examples/instagram/draft.json "$output/instagram #1.jpg"
          "$renderer" instagram preview examples/instagram/draft.json "$output/instagram #1.html"
          test -s "$output/document #1.pdf"
          test -s "$output/instagram #1.jpg"
          test -s "$output/instagram #1.html"
      - name: Upload macOS rendering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-render-smoke-${{ matrix.os }}
          path: build/macos-render-smoke/
          if-no-files-found: warn
          retention-days: 7

  windows-pdf-smoke:
    name: Windows PDF and Marp smoke
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Confirm system Edge is not required on PATH
        shell: pwsh
        run: |
          if (Get-Command msedge.exe -ErrorAction SilentlyContinue) {
            Write-Error 'The smoke test requires Edge discovery outside PATH'
          }
          $edgeCandidates = @(
            "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe",
            "${env:ProgramFiles}\Microsoft\Edge\Application\msedge.exe",
            "${env:LOCALAPPDATA}\Microsoft\Edge\Application\msedge.exe"
          )
          if (-not ($edgeCandidates | Where-Object { Test-Path -LiteralPath $_ })) {
            Write-Error 'Microsoft Edge is not installed in a standard Windows location'
          }
      - name: Render PDF using automatic browser discovery
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/windows-pdf-smoke | Out-Null
          @'
          # Windows PDF auto-discovery smoke

          This document is intentionally self-contained so the smoke test
          validates browser discovery and PDF generation without Poppler.
          '@ | Set-Content -LiteralPath build/windows-pdf-smoke/smoke.md -Encoding utf8
          go run ./cmd/karte-renderer --pdf-engine chromium build/windows-pdf-smoke/smoke.md build/windows-pdf-smoke/smoke.pdf
          $pdf = Get-Item -LiteralPath build/windows-pdf-smoke/smoke.pdf
          if ($pdf.Length -lt 1024) {
            Write-Error "Generated PDF is unexpectedly small: $($pdf.Length) bytes"
          }
      - name: Render Marp using the Windows npm launcher
        shell: pwsh
        run: |
          $outputDir = 'build/windows-pdf-smoke/日本語 & 100%'
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          $browser = @(
            "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe",
            "${env:ProgramFiles}\Microsoft\Edge\Application\msedge.exe",
            "${env:LOCALAPPDATA}\Microsoft\Edge\Application\msedge.exe"
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          foreach ($extension in @('html', 'pdf', 'pptx')) {
            $output = Join-Path $outputDir "slides #1.$extension"
            go run ./cmd/karte-renderer --browser-path "$browser" examples/slides.md "$output"
            if ($LASTEXITCODE -ne 0) { throw "Marp $extension conversion failed" }
            if ((Get-Item -LiteralPath $output).Length -lt 1024) {
              throw "Marp $extension output is unexpectedly small"
            }
          }
      - name: Upload Windows PDF evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-pdf-smoke
          path: build/windows-pdf-smoke/
          if-no-files-found: warn
          retention-days: 7
