name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Validate, package, and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate release tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.(0|[1-9][0-9]*))?$ ]]; then
            echo "Tag must be vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.N: $tag" >&2
            exit 1
          fi
          test "$(git rev-list -n 1 "$tag")" = "$GITHUB_SHA"

      - name: Test
        run: |
          go test -count=1 ./...
          go vet ./...
          npm ci
          npm test

      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          targets=(
            "linux amd64 tar.gz"
            "linux arm64 tar.gz"
            "darwin amd64 tar.gz"
            "darwin arm64 tar.gz"
            "windows amd64 zip"
            "windows arm64 zip"
          )
          for target in "${targets[@]}"; do
            read -r os arch format <<< "$target"
            name="karte-renderer_${GITHUB_REF_NAME}_${os}_${arch}"
            stage="build/$name"
            mkdir -p "$stage"
            executable="karte-renderer"
            if [[ "$os" == "windows" ]]; then executable="karte-renderer.exe"; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -trimpath -o "$stage/$executable" ./cmd/karte-renderer
            cp README.md "$stage/"
            if [[ -f LICENSE ]]; then cp LICENSE "$stage/"; fi
            if [[ "$format" == "zip" ]]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum karte-renderer_* > checksums.txt)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag --generate-notes --title "Karte Renderer $GITHUB_REF_NAME" \
              "${prerelease[@]}"
          fi
